{{- if .Values.neuralbank.oidc.enabled }}
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: neuralbank-oidc
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: neuralbank-api
  when:
    - predicate: request.method != 'OPTIONS'
  rules:
    authentication:
      jwt:
        credentials:
          authorizationHeader:
            prefix: Bearer
        jwt:
          issuerUrl: {{ .Values.neuralbank.oidc.issuerURL | quote }}
{{- end }}
