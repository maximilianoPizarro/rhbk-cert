apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neuralbank
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.neuralbank.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.neuralbank.serviceName }}
          namespace: {{ .Values.neuralbank.serviceNamespace }}
          port: {{ .Values.neuralbank.servicePort }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neuralbank-api
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.neuralbank.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.neuralbank.backendServiceName }}
          namespace: {{ .Values.neuralbank.serviceNamespace }}
          port: {{ .Values.neuralbank.backendServicePort }}
    - matches:
        - path:
            type: PathPrefix
            value: /q
      backendRefs:
        - name: {{ .Values.neuralbank.backendServiceName }}
          namespace: {{ .Values.neuralbank.serviceNamespace }}
          port: {{ .Values.neuralbank.backendServicePort }}
