apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neuralbank
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Release.Namespace }}
  hostnames:
    - {{ .Values.neuralbank.host | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.neuralbank.serviceName }}
          namespace: {{ .Values.neuralbank.serviceNamespace }}
          port: {{ .Values.neuralbank.servicePort }}
