apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-initial-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-initial-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/hub/keycloak-initial-admin
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/hub/keycloak-initial-admin
        property: password
