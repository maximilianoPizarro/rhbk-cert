{{- if gt (int .Values.keycloak.instances) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rhbk
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rhbk
{{- end }}
