{{- if .Values.rhbkCertificate.dnsName }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rhbk-tls
  namespace: {{ .Values.rhbkCertificate.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: {{ .Values.rhbkCertificate.secretName }}
  duration: {{ .Values.rhbkCertificate.duration }}
  renewBefore: {{ .Values.rhbkCertificate.renewBefore }}
  dnsNames:
    - {{ .Values.rhbkCertificate.dnsName }}
  issuerRef:
    name: {{ .Values.rhbkCertificate.issuerRef.name }}
    kind: {{ .Values.rhbkCertificate.issuerRef.kind }}
{{- end }}
