apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.vault.dbPath }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.dbPath }}
        property: password
    - secretKey: database
      remoteRef:
        key: {{ .Values.vault.dbPath }}
        property: database
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
