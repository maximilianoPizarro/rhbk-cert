apiVersion: v1
kind: ConfigMap
metadata:
  name: neuralbank-config
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  config.js: |
    window.__ENV__ = {
      VITE_KEYCLOAK_ISSUER_URL: "https://rhbk.{{ .Values.clusterDomain }}/realms/{{ .Values.keycloak.realm }}",
      VITE_KEYCLOAK_CLIENT_ID: "{{ .Values.keycloak.clientId }}",
      VITE_KEYCLOAK_CLIENT_SECRET: "",
      VITE_KEYCLOAK_AUTHORIZATION_ENDPOINT: "https://rhbk.{{ .Values.clusterDomain }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/auth",
      VITE_KEYCLOAK_REDIRECT_URI: "https://neuralbank.{{ .Values.clusterDomain }}/auth/callback",
      VITE_KEYCLOAK_TOKEN_ENDPOINT: "https://rhbk.{{ .Values.clusterDomain }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token",
      VITE_API_BASE_URL: "/api",
      VITE_KEYCLOAK_POST_LOGOUT_REDIRECT_URI: "https://neuralbank.{{ .Values.clusterDomain }}",
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralbank-frontend
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: neuralbank-frontend
  template:
    metadata:
      labels:
        app: neuralbank-frontend
        app.kubernetes.io/part-of: neuralbank
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /var/www/html/config.js
              subPath: config.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: neuralbank-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.serviceName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: neuralbank-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
