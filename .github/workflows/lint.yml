name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Install yamllint and kubeconform
        run: |
          pip install yamllint
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar -xz -C /usr/local/bin kubeconform

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, comments: disable, new-lines: disable}}" \
            values-hub.yaml values-global.yaml pattern-metadata.yaml \
            charts/all/*/values.yaml charts/all/*/Chart.yaml .github/workflows

      - name: helm lint and kubeconform
        run: |
          for chart in charts/all/*; do
            helm lint "$chart"
            helm template test "$chart" | kubeconform -ignore-missing-schemas -summary -kubernetes-version 1.31.0
          done
